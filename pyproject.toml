[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "servicedesk-lab"
version = "1.0.0"
description = "Tooling for the IT service desk lab: ServiceNow configuration as code, a ticket simulator, the monthly SLA report, Intune policies through Microsoft Graph, and the Azure lab's VM sizing."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "httpx>=0.27",
  "pyyaml>=6.0",
  "openpyxl>=3.1",
  "markdown>=3.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "respx>=0.21",
  "ruff>=0.7",
  "mypy>=1.13",
  "types-PyYAML",
  "types-Markdown",
  "bandit>=1.7",
  "pip-audit>=2.7",
]

[project.scripts]
sdlab = "servicedesk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "N", "C4", "PT"]
ignore = [
  "S101", # assert is fine in tests and type narrowing
]

[tool.ruff.lint.pycodestyle]
max-line-length = 125

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311", "PT018"]
"src/servicedesk/simulate.py" = ["S311"] # random is fine for made-up tickets

[tool.mypy]
python_version = "3.12"
packages = ["servicedesk"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["servicedesk"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.bandit]
exclude_dirs = ["tests"]
